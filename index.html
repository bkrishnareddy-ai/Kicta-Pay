function submitPayment(){const rec=formval('recipient'),amt=num('payAmount'),memo=formval('payNote')||(payMode==='send'?'Money sent':'Payment request'),src=formval('paySource');if(rec.length<2||!validAmount(amt))return note('Enter a recipient and valid amount');const bal=src==='personal'?data.personal:data.wallets.find(w=>'wallet:'+w.id===src)?.balance;if(payMode==='send'&&(bal===undefined||bal+1e-8<amt))return note('Insufficient balance');modal(`<h3>Review ${payMode==='send'?'payment':'request'}</h3><div class="line"><span>Recipient</span><strong>${esc(rec)}</strong></div><div class="line"><span>Amount</span><strong>${money(amt)}</strong></div><div class="line"><span>Note</span><span>${esc(memo)}</span></div><p class="hint">Confirm to record this simulated transaction.</p><div class="actions"><button class="btn soft wide" onclick="closeModal()">Cancel</button><button class="btn primary wide" onclick="commitPayment(${JSON.stringify({rec,amt,memo,src,payMode}).replaceAll('"','&quot;')})">Confirm</button></div>`)}
function commitPayment(t){if(t.payMode==='send'){if(t.src==='personal'){if(data.personal<t.amt)return note('Insufficient balance');data.personal=round(data.personal-t.amt)}else{let w=data.wallets.find(w=>'wallet:'+w.id===t.src);if(!w||w.balance<t.amt)return note('Insufficient wallet balance');w.balance=round(w.balance-t.amt)}}else data.requests.unshift({id:eid(),recipient:t.rec,amount:t.amt,note:t.memo,status:'Requested'});data.transactions.unshift({id:eid(),title:t.memo,person:t.rec,amount:t.payMode==='send'?-t.amt:t.amt,status:t.payMode==='send'?'Paid':'Requested',type:t.payMode==='send'?'Send':'Request',date:today()});save();closeModal();goto('home');note(t.payMode==='send'?'Simulated payment recorded':'Payment request created')}

function toggleSplitMember(name,on){if(selectedSplitMembers===null)selectedSplitMembers=splitPeople().slice();if(on){if(!selectedSplitMembers.includes(name))selectedSplitMembers.push(name)}else{if(selectedSplitMembers.length<=1)return note('Keep at least one person selected');selectedSplitMembers=selectedSplitMembers.filter(x=>x!==name)}customShares={};percentShares={};itemShares={};if(mode!=='equal')seedShares(mode);render()}
function addSplitMember(){const el=$('newSplitMember'),name=el?.value.trim().replace(/\s+/g,' ');if(!name||name.length<2)return note('Enter a name of at least 2 characters');const all=[...(group()?.members||[]),...extraSplitMembers];if(all.some(m=>m.toLowerCase()===name.toLowerCase()))return note('This person is already listed');extraSplitMembers.push(name);if(selectedSplitMembers===null)selectedSplitMembers=splitPeople().slice();selectedSplitMembers.push(name);customShares={};percentShares={};itemShares={};if(mode!=='equal')seedShares(mode);render();note(name+' added to this split')}
function demoParticipants(){selectedSplitMembers=null;extraSplitMembers=[];render();note('All group members selected')}

function splitAllocation(){const ms=splitPeople(),total=Number(splitTotal)||0,n=ms.length;if(!n)return [];if(mode==='equal'){const cents=Math.round(total*100),each=Math.floor(cents/n);return ms.map((_,i)=>(each+(i<cents%n?1:0))/100)}if(mode==='custom')return ms.map(m=>Number(customShares[m]||0));if(mode==='percentage'){const percentages=ms.map(m=>Number(percentShares[m]||0));const cents=Math.round(total*100);if(Math.abs(percentages.reduce((a,b)=>a+b,0)-100)<.000001){const raw=percentages.map(p=>cents*p/100),bases=raw.map(Math.floor);let remaining=cents-bases.reduce((a,b)=>a+b,0);const ranked=raw.map((v,i)=>({i,fraction:v-bases[i]})).sort((a,b)=>b.fraction-a.fraction||a.i-b.i);for(let k=0;k<remaining;k++)bases[ranked[k%ranked.length].i]++;return bases.map(v=>v/100)}return percentages.map(p=>round(total*p/100))}return ms.map(m=>round(itemShares[m]||0))}

function seedShares(method){
 const ms=splitPeople(),n=ms.length,totalCents=Math.round(Number(splitTotal)*100);
 if(method==='custom'){
   const weights=ms.map((_,i)=>n-i), denom=weights.reduce((a,b)=>a+b,0),left=totalCents;
   let assigned=0;ms.forEach((m,i)=>{const cents=i===n-1?left-assigned:Math.floor(left*weights[i]/denom);customShares[m]=(cents/100).toFixed(2);assigned+=cents});
 }
 if(method==='percentage'){
  const weights=ms.map((_,i)=>n-i), denom=weights.reduce((a,b)=>a+b,0);let assigned=0;
  ms.forEach((m,i)=>{const basis=i===n-1?10000-assigned:Math.floor(weights[i]*10000/denom);percentShares[m]=(basis/100).toFixed(2);assigned+=basis});
 }
 if(method==='items'){
   itemShares={};const cents=Math.round(receiptTotal()*100),base=Math.floor(cents/n);ms.forEach((m,i)=>itemShares[m]=(base+(i<cents%n?1:0))/100);
 }
}
function autoFillSplit(){
 if(mode==='items'){
    confirmReceipt();return;
 }
 if(mode==='custom'||mode==='percentage')seedShares(mode);

 render();note('Calculated '+({equal:'equal',custom:'custom',percentage:'percentage'}[mode])+' split automatically');
}
function makeDemoReceipt(sample){
 const ms=splitPeople(),items=sample.items.map(([name,price],i)=>({name,price,member:ms[i%ms.length]}));
 const subtotal=round(items.reduce((sum,x)=>sum+x.price,0));
 const tax=round(subtotal*sample.taxRate),tip=round(subtotal*sample.tipRate);
 const lines=[sample.merchant,'DEMO RECEIPT',...items.map(x=>`${x.name}   $${x.price.toFixed(2)}`),`Subtotal  $${subtotal.toFixed(2)}`,`Tax   $${tax.toFixed(2)}`,`Tip   $${tip.toFixed(2)}`,`TOTAL   $${round(subtotal+tax+tip).toFixed(2)}`];
 const safe=s=>String(s).replace(/[<>&"']/g,'');
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 ${110+lines.length*31}"><rect width="360" height="100%" rx="14" fill="#fffdf8"/><text x="180" y="42" font-family="Arial" text-anchor="middle" fill="#133e68" font-weight="bold" font-size="22">${safe(sample.merchant)}</text>${lines.slice(1).map((line,i)=>`<text x="22" y="${76+i*31}" font-size="15" font-family="monospace" fill="#34465a">${safe(line)}</text>`).join('')}</svg>`;
 return {merchant:sample.merchant,items,tax,tip,image:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)};
}

function safeSplit(x){return Number.isFinite(Number(x))?Math.round(Number(x)*100)/100:0}
function splitLedger(){return data.splits.filter(x=>x&&Array.isArray(x.allocations)).slice().sort((a,b)=>b.id-a.id)}
function balanceByMember(){const ledger=splitLedger(),all=new Map();for(const x of ledger){for(const a of x.allocations){if(a.name==='You')continue;const key=a.name;all.set(key,safeSplit((all.get(key)||0)+Number(a.amount||0)-Number(a.paid||0)));}}return [...all].map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount)}
function splitHomeView(){
 const rec=splitLedger(),balances=balanceByMember(),outstanding=safeSplit(balances.reduce((a,b)=>a+Math.max(0,b.amount),0));

function settleMember(id,i){const x=data.splits.find(t=>t.id===id),a=x?.allocations[i];if(!a||a.name==='You')return;const due=safeSplit(a.amount-(a.paid||0));if(due<=0)return note('Already settled');modal(`<h3>Record repayment</h3><p>${esc(a.name)} paid ${money(due)} for ${esc(x.name)}?</p><div class="actions"><button class="btn soft wide" onclick="closeModal()">Cancel</button><button class="btn primary wide" onclick="confirmSettle(${id},${i})">Mark as paid</button></div>`)}

function splitView(){const ms=splitPeople(),vals=splitAllocation(),sum=round(vals.reduce((a,b)=>a+b,0)),total=round(splitTotal),difference=round(total-sum);return `<div class="card"><div class="flex between" style="align-items:center;flex-wrap:wrap"><h3 class="heading" style="margin:0">Create a shared expense</h3><button class="btn smallfill" onclick="createDemoExpense()">✦ Generate demo bill</button></div><p class="sub">${esc(demoExpenseName)} · Enter your own total or generate a realistic sample.</p><div class="grid2"><label class="field">Total bill (CAD)<input id="splitTotal" type="number" step="0.01" min="0.01" value="${splitTotal}" onchange="splitTotalChange(this.value)"></label><label class="field">Private group<select onchange="splitGroupChange(this.value)">${data.groups.map(g=>`<option value="${g.id}" ${splitGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label></div><div class="flex between" style="margin-top:17px"><h3 class="heading" style="margin:0">Choose split method</h3><button class="btn smallfill" onclick="autoFillSplit()">Auto-fill shares</button></div><div class="seg">${[['equal','Equal Split'],['custom','Custom Amount'],['percentage','Percentage'],['items','Split by Items']].map(([k,n])=>`<button class="${mode===k?'active':''}" onclick="setSplitMode('${k}')">${n}</button>`).join('')}</div><div class="hint">${{equal:'Equal amounts, with cents distributed automatically.',custom:'Enter the exact amount owed by each member.',percentage:'Enter each person’s percentage; total must equal 100%.',items:'Allocate item totals using the receipt editor, then send requests.'}[mode]}</div>${mode==='items'?'<button class="btn outline wide" onclick="goto(&quot;scan&quot;)">Open receipt item assignment →</button>':''}</div><div class="card">${splitMemberControls()}<div class="flex between" style="margin-top:15px"><h3 class="heading">Share breakdown</h3><button class="text-action" onclick="demoParticipants()">Reset people</button></div>${ms.map((m,i)=>`<div class="member"><div class="avatar">${esc(m[0])}</div><div><b>${esc(m)}</b><div class="sub">${mode==='percentage'?'Percentage':'Amount owed'}</div></div>${mode==='custom'||mode==='percentage'?`<input aria-label="${esc(m)} ${mode}" type="number" min="0" step="0.01" value="${mode==='custom'?(customShares[m]??''):(percentShares[m]??'')}" oninput="editShare('${esc(m)}',this.value)">`:`<div class="amount">${money(vals[i])}</div>`}</div>`).join('')}<div class="line"><b>Allocated</b><strong id="allocatedTotal">${money(sum)} / ${money(total)}</strong></div><div class="${Math.abs(difference)<=.001?'ok':'error'}" id="splitValidation">${Math.abs(difference)<=.001?'Amounts balance correctly.':'Unallocated difference: '+money(difference)}</div><button class="btn primary wide" style="margin-top:14px" onclick="sendSplit()">Send Requests</button></div>`}
function splitTotalChange(v){splitTotal=Number(v);render()}function splitGroupChange(v){splitGroup=Number(v);selectedSplitMembers=null;extraSplitMembers=[];customShares={};percentShares={};itemShares={};render()}function setSplitMode(m){mode=m;if(m==='percentage'&&Object.keys(percentShares).length===0)seedShares('percentage');if(m==='custom'&&Object.keys(customShares).length===0)seedShares('custom');if(m==='items'&&Object.keys(itemShares).length===0)seedShares('items');render()}
function editShare(m,v){if(mode==='custom')customShares[m]=v;else percentShares[m]=v;const amounts=splitAllocation(),sum=round(amounts.reduce((a,b)=>a+b,0)),diff=round(splitTotal-sum);if($('allocatedTotal'))$('allocatedTotal').textContent=money(sum)+' / '+money(splitTotal);$('splitValidation').className=Math.abs(diff)<.001?'ok':'error';$('splitValidation').textContent=Math.abs(diff)<.001?'Amounts balance correctly.':'Unallocated difference: '+money(diff)}
function sendSplit(){if(!validAmount(Number(splitTotal)))return note('Enter a positive total bill');const ms=splitPeople(),vals=splitAllocation(),sum=round(vals.reduce((a,b)=>a+b,0));if(Math.abs(round(sum-splitTotal))>.001)return note('Shares must add up exactly to bill total');if(mode==='percentage'&&Math.abs(ms.reduce((s,m)=>s+Number(percentShares[m]||0),0)-100)>.001)return note('Percentages must total 100%');if(vals.some(x=>!Number.isFinite(x)||x<0))return note('Shares cannot be negative');modal(`<h3>Confirm group requests</h3><p class="sub">${esc(group().name)} · ${money(splitTotal)}</p>${ms.map((m,i)=>`<div class="line"><span>${esc(m)}</span><strong>${money(vals[i])}</strong></div>`).join('')}<div class="actions"><button class="btn soft wide" onclick="closeModal()">Cancel</button><button class="btn primary wide" onclick="commitSplit()">Send Requests</button></div>`)}
function commitSplit(){const members=splitPeople(),vals=splitAllocation();
 const ledgerItem={id:eid(),name:demoExpenseName||'Shared expense',groupId:group().id,groupName:group().name,total:round(splitTotal),date:today(),method:({equal:'Equal',custom:'Custom amounts',percentage:'Percentage',items:'Itemized'}[mode]),origin:mode==='items'?'receipt':'manual',allocations:members.map((name,i)=>({name,amount:round(vals[i]),paid:0}))};
 data.splits.unshift(ledgerItem);members.forEach((m,i)=>{if(m==='You'||vals[i]===0)return;data.requests.unshift({id:eid(),recipient:m,amount:vals[i],note:'Group bill · '+group().name,status:'Requested'});data.transactions.unshift({id:eid(),title:'Shared expense · '+group().name,person:m,amount:vals[i],type:'Request',status:'Requested',date:today()})});save();closeModal();splitLedgerTab='recent';pageHistory.length=0;goto('split');note('Split saved · See it in Recent Splits')}

function uploadReceipt(e){const file=e.target.files?.[0];if(!file)return;if(file.size>2500000)return note('Please choose an image under 2.5 MB');if(!file.type.startsWith('image/'))return note('Please select an image');const r=new FileReader();r.onload=()=>{receipt.image=r.result;render();note('Receipt image attached. Edit items below.')};r.readAsDataURL(file)}
function updateReceiptItem(i,k,v){receipt.items[i][k]=k==='price'?Number(v):v;render()}function updateReceiptFee(k,v){receipt[k]=Number(v);render()}function addReceiptItem(){receipt.items.push({name:'New item',price:0,member:splitPeople()[0]});render()}function deleteReceiptItem(i){receipt.items.splice(i,1);render()}
function confirmReceipt(){if(!receipt.items.length||receipt.items.some(i=>!i.name||!Number.isFinite(Number(i.price))||i.price<0)||Number(receipt.tax)<0||Number(receipt.tip)<0||receiptTotal()<=0)return note('Check receipt items and amounts');splitTotal=receiptTotal();mode='items';itemShares={};const ms=splitPeople();ms.forEach(m=>itemShares[m]=0);receipt.items.forEach(i=>{const member=ms.includes(i.member)?i.member:ms[0];itemShares[member]=round(itemShares[member]+Number(i.price))});const fees=round(Number(receipt.tax)+Number(receipt.tip)),cents=Math.round(fees*100),base=Math.floor(cents/ms.length),rem=cents%ms.length;ms.forEach((m,i)=>itemShares[m]=round(itemShares[m]+(base+(i<rem?1:0))/100));demoExpenseName=receipt.merchant+' receipt';if(Math.abs(round(splitAllocation().reduce((a,b)=>a+b,0)-splitTotal))>.001)return note('Receipt allocation total does not match the bill');commitSplit();note('Scanned receipt saved in Recent Splits')}

function payBill(id){const b=data.bills.find(x=>x.id===id);if(data.personal<b.amount)return note('Not enough personal funds to pay this bill');modal(`<h3>Pay ${esc(b.name)}</h3><p>Charge <b>${money(b.amount)}</b> to your simulated personal balance?</p><div class="actions"><button class="btn soft wide" onclick="closeModal()">Cancel</button><button class="btn primary wide" onclick="commitBillPay(${id})">Confirm</button></div>`)}
function commitBillPay(id){const b=data.bills.find(x=>x.id===id);if(data.personal<b.amount)return note('Insufficient funds');data.personal=round(data.personal-b.amount);b.status='Paid';if(b.frequency!=='Once'){const dt=new Date(b.due+'T12:00:00');if(b.frequency==='Weekly')dt.setDate(dt.getDate()+7);else dt.setMonth(dt.getMonth()+1);b.due=dt.toISOString().slice(0,10);b.status='Upcoming'}data.transactions.unshift({id:eid(),title:b.name,person:'Biller',amount:-b.amount,type:'Bill',status:'Paid',date:today()});save();closeModal();render();note('Demo bill payment recorded')}
function activityView(){return `<div class="card"><h3 class="heading">Transaction and request history</h3>${data.transactions.length?data.transactions.map(t=>`<div class="line"><div style="min-width:0"><div class="name">${esc(t.title)}</div><div class="sub">${esc(t.person)} · ${esc(t.date)} · ${esc(t.type)}</div></div><div style="text-align:right"><b>${t.amount>0?'+':''}${money(t.amount)}</b><div><span class="pill ${t.status==='Paid'?'paid':''}">${esc(t.status)}</span></div></div></div>`).join(''):'<p class="muted">No activity yet</p>'}</div>${data.requests.filter(r=>r.status==='Requested').length?`<div class="card"><h3 class="heading">Outstanding requests</h3>${data.requests.filter(r=>r.status==='Requested').map(r=>`<div class="line"><div><b>${esc(r.recipient)}</b><div class="sub">${esc(r.note)}</div></div><div><strong>${money(r.amount)}</strong><div><button class="iconbtn" onclick="cancelRequest(${r.id})">Cancel</button></div></div></div>`).join('')}</div>`:''}`}
function cancelRequest(id){const r=data.requests.find(x=>x.id===id);if(!r)return;r.status='Cancelled';const tx=data.transactions.find(x=>x.type==='Request'&&x.person===r.recipient&&x.status==='Requested'&&x.amount===r.amount);if(tx)tx.status='Cancelled';save();render();note('Request cancelled')}
function shopView(){return `<div class="card"><h3 class="heading">Merchant payment demo</h3><p class="sub">Simulates checkout with a participating online or physical retailer.</p><form class="stack" onsubmit="event.preventDefault();shopReview()"><label class="field">Merchant<input id="shopName" required maxlength="60" placeholder="Merchant name"></label><label class="field">Amount<input id="shopAmount" type="number" min="0.01" step="0.01" required></label><label class="field">Payment method<select id="shopMethod"><option>Online checkout</option><option>Retail QR payment</option><option>Contactless / virtual card</option></select></label><button class="btn primary wide">Review checkout</button></form><p class="notice">No live QR scanning, NFC, merchant network, or card processing.</p></div>`}function shopReview(){const m=formval('shopName'),a=num('shopAmount'),method=formval('shopMethod');if(m.length<2||!validAmount(a))return note('Enter a valid merchant and amount');if(data.personal<a)return note('Insufficient personal balance');modal(`<h3>Confirm merchant checkout</h3><p>${esc(m)} · ${esc(method)}</p><div class="money">${money(a)}</div><button class="btn primary wide" onclick="commitShop(${JSON.stringify({m,a,method}).replaceAll('"','&quot;')})">Confirm simulated payment</button>`)}function commitShop(o){if(data.personal<o.a)return note('Insufficient balance');data.personal=round(data.personal-o.a);data.transactions.unshift({id:eid(),title:'Merchant · '+o.m,person:o.m,amount:-o.a,type:o.method,status:'Paid',date:today()});save();closeModal();goto('home');note('Merchant payment simulated')}
function settingsView(){return `<div class="card"><h3 class="heading">Profile</h3><div class="line"><span>Account</span><b>${esc(data.user.email)}</b></div><div class="line"><span>Name</span><b>${esc(data.user.name)}</b></div><button class="btn outline wide" onclick="editProfile()">Edit profile</button></div><div class="card"><h3 class="heading">Security & privacy</h3><div class="line"><div><b>Biometric sign-in</b><div class="sub">UI demo preference only</div></div><input type="checkbox" ${data.security.biometric?'checked':''} onchange="data.security.biometric=this.checked;save()"></div><div class="line"><div><b>Security notifications</b><div class="sub">Activity alert preference</div></div><input type="checkbox" ${data.security.alerts?'checked':''} onchange="data.security.alerts=this.checked;save()"></div><p class="hint">Transactions are private by default in this local demo. Production-grade MFA, fraud detection, encryption, KYC and payment gateways require a secure backend.</p></div><button class="btn soft wide" onclick="logout()">Sign Out</button><button class="btn danger wide" style="margin-top:10px" onclick="resetDemo()">Reset All Demo Data</button>`}
function editProfile(){modal(`<h3>Edit profile</h3><form class="stack" onsubmit="event.preventDefault();commitProfile()"><label class="field">Name<input id="profileName" required value="${esc(data.user.name)}"></label><button class="btn primary wide">Save</button></form>`)}function commitProfile(){const n=formval('profileName');if(n.length<2)return note('Enter a valid name');data.user.name=n;save();closeModal();render();note('Profile updated')}
function logout(){authStage='choice';pageHistory.length=0;data.user=null;
if(!Array.isArray(data.splits))data.splits=[];
let splitLedgerTab="recent",openSplitId=null;save();goto('welcome',true)}function resetDemo(){if(!confirm('Erase all simulated balances, groups and history?'))return;data=seed();save();goto('welcome');note('Demo reset')}
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},30000);$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render();
</script></body></html>
